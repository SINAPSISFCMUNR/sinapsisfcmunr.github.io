<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFAFE;--ink:#262044;--soft:#6B6489;--line:#E3DEF0;--wash:#F2EFFA;--hem:#4F3FA0;--hem2:#3A2D80;--nuc:#3B2E86;--eos:#C2457A;--eosl:#F6D7E4;--eosm:#E7A3C0;--ok:#16705F;--okw:#E2F2EC;--ko:#B32E62;--kow:#FBE5ED;--warn:#A86A0C;--on:#fff;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#15121F;--ink:#ECE8FA;--soft:#A39CC2;--line:#2D2843;--wash:#1E1A31;--hem:#A596F2;--hem2:#C4B9FF;--nuc:#C4B9FF;--eos:#F08BB3;--eosl:#3D2436;--eosm:#8E4A6C;--ok:#6FD3B8;--okw:#15302A;--ko:#FF8DB4;--kow:#3A1C2A;--warn:#F0B451;--on:#15121F;color-scheme:dark}}
:root[data-theme=dark]{--paper:#15121F;--ink:#ECE8FA;--soft:#A39CC2;--line:#2D2843;--wash:#1E1A31;--hem:#A596F2;--hem2:#C4B9FF;--nuc:#C4B9FF;--eos:#F08BB3;--eosl:#3D2436;--eosm:#8E4A6C;--ok:#6FD3B8;--okw:#15302A;--ko:#FF8DB4;--kow:#3A1C2A;--warn:#F0B451;--on:#15121F;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}

button:hover{background:var(--hem2)}
button.ghost{background:transparent;color:var(--hem);border-color:var(--line)}
button.ghost:hover{background:var(--wash)}
:focus-visible{outline:2px solid var(--eos);outline-offset:2px}
.hero{display:grid;grid-template-columns:230px 1fr;gap:36px;align-items:center;margin:4px 0 8px}
.field{width:230px;height:auto;display:block;animation:focus 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes focus{from{filter:blur(8px);opacity:.4;transform:scale(1.05)}to{filter:none;opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.field{animation:none}}
.field .bg{fill:var(--eosl)}.field .lp{fill:var(--eosm)}.field .ep{fill:none;stroke:var(--hem);stroke-width:2.6}
.field .nu{fill:var(--nuc)}.field .gb{fill:var(--paper);opacity:.9}.field .lc{stroke:var(--paper);stroke-width:1.6;opacity:.7}
.field .cr{fill:var(--paper);stroke:var(--hem);stroke-width:1.4;opacity:.85}.field .mu{fill:var(--eos);opacity:.55}.field .rim{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.25}
.scale{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:12px;margin:10px 0 0 6px}.scale i{display:block;width:38px;height:2px;background:var(--soft)}
.hero h1{font-size:clamp(44px,9vw,68px);line-height:.95;letter-spacing:-.035em;font-weight:700}
.hero .sub{color:var(--soft);margin:12px 0 0;font-size:18px}
.verse{margin:24px 0 0;padding:0;font:italic 400 18px/1.6 Spectral,Georgia,'Times New Roman',serif;max-width:44ch;color:var(--ink)}
.verse cite{display:block;font:normal 600 13px/1.4 'Bricolage Grotesque',system-ui,sans-serif;color:var(--eos);margin-top:8px}
@media(max-width:620px){.hero{grid-template-columns:1fr;gap:18px}.field{width:180px}}
section{margin-top:52px}
section>h2{font-size:23px;letter-spacing:-.02em}
.note{color:var(--soft);margin:4px 0 16px;font-size:15px;max-width:60ch}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;width:100%;text-align:left;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 8px;font-weight:400}
.row:hover{background:var(--wash)}
.ic svg{width:46px;height:46px;display:block}
.ic .f{fill:var(--eosl);stroke:var(--hem);stroke-width:2.2;stroke-linejoin:round}
.ic .s{fill:none;stroke:var(--hem);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .t1{fill:none;stroke:var(--hem);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.ic .t2{fill:none;stroke:var(--eosl);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ic .d{fill:var(--hem)}
.row b{display:block;font-size:17px;font-weight:600}
.row small{color:var(--soft);font-size:14px}
.meta{text-align:right;color:var(--soft);font-size:13px;white-space:nowrap}
.meta strong{display:block;color:var(--ink);font-size:17px;font-weight:600}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:32px;border-top:1px solid var(--line)}
.mat{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--ink);padding:13px 6px;font-weight:400}
.mat:hover{background:var(--wash)}
.mat span{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mat b{font-weight:600}.mat em{font-style:normal;color:var(--soft);font-size:14px;white-space:nowrap}
.mat i{display:block;height:3px;margin-top:9px;background:var(--line);border-radius:2px;overflow:hidden}
.mat i::after{content:"";display:block;height:100%;width:var(--w);background:var(--eos)}
.mat small{display:block;color:var(--soft);font-size:12px;margin-top:4px}
.tbl{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--soft);font-weight:500}
td button{padding:6px 14px;font-size:13px}
.empty{color:var(--soft);font-size:15px;padding:16px 0;border-top:1px solid var(--line)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:-32px -20px 0;padding:14px 20px 0}
.bar .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar h2{font-size:18px}.bar .cnt{color:var(--soft);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:5px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.dots::-webkit-scrollbar{display:none}
.dots button{flex:0 0 auto;width:30px;height:30px;padding:0;border-radius:50%;font-size:12px;background:transparent;color:var(--soft);border:1px solid var(--line);font-weight:500}
.dots button.on{background:var(--hem);border-color:var(--hem);color:var(--on)}
.prog{height:3px;background:var(--line);margin:0 -20px}.prog i{display:block;height:100%;width:0;background:var(--eos);transition:width .3s}
.bar.slim{padding-bottom:14px}
.q{display:grid;grid-template-columns:46px 1fr;gap:6px 10px;padding:30px 0;border-bottom:1px solid var(--line)}
.q .n{font:500 26px/1.1 Spectral,Georgia,serif;color:var(--eos)}
.stem{font:400 19px/1.55 Spectral,Georgia,'Times New Roman',serif;margin:0 0 14px;max-width:62ch}
.tag{color:var(--soft);font-size:13px;margin:-8px 0 12px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:10px 12px;margin:2px 0;color:var(--ink);font-weight:400;line-height:1.45}
button.opt:hover{background:var(--wash)}
.opt .l{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--soft)}
.opt.sel{background:var(--wash)}.opt.sel .l{background:var(--hem);border-color:var(--hem);color:var(--on)}
.opt.ok{background:var(--okw)}.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--on)}
.opt.ko{background:var(--kow)}.opt.ko .l{background:var(--ko);border-color:var(--ko);color:var(--on)}
.opt em{display:block;font-style:normal;font-size:13px;font-weight:600;margin-top:2px}
.opt.ok em{color:var(--ok)}.opt.ko em{color:var(--ko)}
.ex{margin:14px 0 0;border-left:3px solid var(--eos);padding:4px 0 4px 16px;font:400 16px/1.6 Spectral,Georgia,serif;max-width:62ch}
.ex b{display:block;font:600 13px/1.5 'Bricolage Grotesque',system-ui,sans-serif;color:var(--eos)}
.ex.warn{border-color:var(--warn)}.ex.warn b{color:var(--warn)}
.end{display:flex;gap:10px;flex-wrap:wrap;padding:32px 0 0}
.result{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-top:36px}
.ring svg{width:132px;height:132px;display:block}
.ring .rt{fill:var(--eosl);stroke:var(--line);stroke-width:10}.ring .rf{fill:none;stroke:var(--hem);stroke-width:10;stroke-linecap:round}
.ring text{font:700 24px 'Bricolage Grotesque',system-ui,sans-serif;fill:var(--ink)}
.big{font-size:60px;font-weight:700;letter-spacing:-.04em;line-height:1}.big span{color:var(--soft);font-weight:400}
.result p{color:var(--soft);margin:8px 0 0}
.areas{border-top:1px solid var(--line)}
.ar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.ar i{display:block;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.ar i b{display:block;height:100%;background:var(--eos)}
.ar em{font-style:normal;color:var(--soft);text-align:right;font-size:14px}
details{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:16px 0;font-weight:600;font-size:17px}
.gab{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.g{padding:7px 9px;border-radius:10px;font-size:14px;background:var(--wash)}
.g b{font-weight:600;margin-right:6px;color:var(--soft)}.g.okc{background:var(--okw)}.g.koc{background:var(--kow)}.g s{color:var(--ko)}
.modal{position:fixed;inset:0;background:rgba(21,18,31,.45);display:grid;place-items:center;z-index:20;padding:20px}
.panel{background:var(--paper);border-radius:22px;padding:26px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(21,18,31,.25)}
.panel h3{font-size:20px}.panel p{color:var(--soft);margin:8px 0 20px}
@media(max-width:620px){.q{grid-template-columns:28px 1fr;gap:6px 8px}.q .n{font-size:21px}.ar{grid-template-columns:1fr auto;row-gap:6px}.ar i{grid-column:1/-1;grid-row:2}.result{gap:18px}.ring svg{width:104px;height:104px}.big{font-size:48px}}
.sign{margin:10px 0 0;font:italic 500 16px/1.4 Spectral,Georgia,'Times New Roman',serif;color:var(--hem);letter-spacing:.01em}
footer{margin-top:64px;color:var(--soft);font-size:13px}
.q .n{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.star{background:none;border:0;padding:2px 0;font:400 20px/1 system-ui,sans-serif;color:var(--line);border-radius:6px}
.star:hover{background:none;color:var(--soft)}.star.on,.star.on:hover{color:#D9A21B}
.tog.on,.tog.on:hover{background:var(--hem);color:var(--on);border-color:var(--hem)}
button.opt:disabled{cursor:default}button.opt.ok:hover{background:var(--okw)}button.opt.ko:hover{background:var(--kow)}button.opt:disabled:not(.ok):not(.ko):hover{background:none}
.verdict{margin:12px 0 0;font-weight:600}.okv{color:var(--ok)}.kov{color:var(--ko)}
.glyph{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--eosl);color:var(--hem);font-size:19px;font-weight:600}
.row:disabled{cursor:default;opacity:.6}.row:disabled:hover{background:none}
@media(max-width:620px){.bar .acts{gap:6px}.bar .acts button{padding:6px 11px;font-size:13.5px}.bar{padding-top:10px}.dots{padding:8px 0}}
.sx-ol{padding-left:22px}.sx-ol li{margin:10px 0;line-height:1.55;max-width:66ch}
.sx .card{background:var(--wash);border-radius:16px;padding:16px 18px;margin:14px 0}
.sx .card h3{font-size:17px;margin:0 0 8px}.sx ul{margin:6px 0 0;padding-left:20px}.sx li{margin:6px 0;line-height:1.5}
.sx .t-ok{color:var(--ok);font-weight:600}.sx .t-ko{color:var(--ko);font-weight:600}.sx p{max-width:66ch}
.sx table td:first-child{font-weight:600}.sx .big2{font:700 20px/1.3 'Bricolage Grotesque',system-ui,sans-serif}
.row.lock,.mat.lock{opacity:.62}.row.lock .meta strong{display:flex;justify-content:flex-end}.mat.lock em{display:inline-flex;align-items:center;gap:6px}
small.free{color:var(--ok);font-weight:600}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--wash);border-radius:16px;padding:14px 18px;margin:8px 0 28px;font-size:15px;line-height:1.45}
.demo>b{background:var(--hem);color:var(--on);border-radius:999px;padding:5px 12px;font-size:13px}.demo span{flex:1;min-width:220px}.demo a{font-weight:600;color:var(--hem);text-decoration:none;padding:8px 0}
a.cta{display:inline-flex;align-items:center;background:var(--hem);color:var(--on);border-radius:999px;padding:10px 18px;font-weight:600;text-decoration:none}
.panel .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
</style></head>

<script>
const L='abcdef';
function okA(q,a){return a===q.c||(!!q.k&&q.k.includes(a))}
function cl(q){return (q.k||[q.c]).map(j=>L[j]).join(' y ')}
const TEMAS={"Tema 1":[{"q":"Marque la opción correcta con respecto al yeyunoileon","o":["Es la porción del tubo digestivo irrigada por la arteria gastroduodenal","Se relaciona hacia arriba con el colon transverso y su meso.","Su longitud es de aproximadamente 60 centímetros.","Se encuentra unido al peritoneo parietal posterior a través del epiplón menor"],"c":1,"e":"Hacia arriba se relaciona con el colon transverso y su mesocolon. Lo irriga la mesentérica superior y se fija por el mesenterio."},{"q":"Marque la opción correcta con respecto a la irrigación del aparato digestivo:","o":["Las venas hemorroidales o rectales superiores son tributarias de la vena cava superior","Las venas coronarias estomáquicas o gástricas izquierdas son tributarias de la vena cava inferior.","La vena porta se forma por la unión de la vena hepática y la vena coronaria estomáquica o gástrica izquierda","La vena porta es la encargada de la irrigación funcional del hígado."],"c":3,"e":"La vena porta trae la sangre del tubo digestivo (circulación funcional); la arteria hepática nutre al hígado."},{"q":"El plexo encargado de inervar al estómago, intestino delgado e hígado entre otros órganos es el:","o":["Solar o celíaco","Hipogástrico superior","Hipogástrico inferior","Hemorroidal"],"c":0,"e":"El plexo solar o celíaco inerva estómago, intestino delgado e hígado; los hipogástricos inervan órganos pelvianos."},{"q":"La tasa de metabolismo basal:","o":["Aumenta con la edad.","Es mayor en las mujeres.","Es mayor en los hombres.","Depende de la masa ósea."],"c":2,"e":"Los hombres tienen más masa magra, por eso su metabolismo basal es mayor."},{"q":"Se define como valor calórico de un nutriente a:","o":["La cantidad de kcal que aporta cada gramo de nutriente energético.","La cantidad de nutriente que se obtiene de un alimento.","La cantidad de kcal que se puede obtener de los alimentos.","La cantidad ingerida en gramos de cada alimento"],"c":0,"e":"Son las kcal por gramo: 4 para hidratos y proteínas, 9 para lípidos."},{"q":"Una adolescente consume una dieta diaria con la siguiente Fórmula Calórica: Proteínas 35%, Lípidos 25%, Hidratos de Carbono 40%. De acuerdo a la 3ª Ley de Escudero esta dieta es:","o":["Hipoproteica, Normolipídica e Hipoglucídica","Hiperproteica, Hiperlipídica e Hipoglucídica","Hipoproteica, Normolipídica e Hiperglucídica","Hiperproteica, Normolipídica e Hipoglucídica"],"c":3,"e":"Proteínas 35% (normal 10-15%): hiper; lípidos 25% (normal 25-35%): normo; hidratos 40% (normal 50-60%): hipo."},{"q":"En el intestino grueso ¿cuál de estas células sintetiza serotonina?","o":["Enterocitos","Células caliciformes","Células de Paneth","Células enteroendocrinas"],"c":3,"e":"Las células enteroendocrinas (enterocromafines) producen serotonina."},{"q":"Las placas de Peyer son:","o":["Placas de calcio que se depositan con el paso del tiempo en los vasos sanguíneos entéricos","Acúmulos de tejido linfático en la pared del intestino delgado","Placas de moco que recubren la superficie intestinal","Acúmulos de material no absorbido en la luz intestinal"],"c":1,"e":"Son agregados de folículos linfoides del intestino delgado, sobre todo del íleon."},{"q":"Indique la función de las células de Paneth intestinales","o":["Producen lisozima","Son presentadoras de antígenos a los linfocitos de la lámina propia","Regulan la secreción por parte de las células endócrinas del intestino","Producen sustancias que estimulan la mitosis de los enterocitos"],"c":0,"e":"Las células de Paneth, en el fondo de las criptas, secretan lisozima y defensinas."},{"q":"La bomba Na-K ATPasa que se encuentra en la membrana basolateral de las células del intestino delgado:","o":["Mantiene una baja concentración de Na extracelular","Es responsable de la baja concentración de K intracelular","Mantiene el gradiente electroquímico del Na+ de la cara apical en dichas células.","Mantiene una alta concentración de K extracelular"],"c":2,"e":"La bomba saca Na+ y mantiene el gradiente que impulsa el cotransporte apical de Na+."},{"q":"La salida de glucosa de las células intestinales al espacio intersticial se realiza por","o":["Cotransporte","Difusión facilitada","Transporte activo primario","Contratransporte"],"c":1,"e":"Sale por la membrana basolateral por difusión facilitada (GLUT2)."},{"q":"A nivel de los conductos pancreáticos","o":["La secreción se alcaliniza, ganando bicarbonato y perdiendo iones cloruro","La secreción se enriquece en iones cloruro y pierde bicarbonato","La secreción aumenta su contenido en enzimas por la contribución de las células ductales","No se producen modificaciones en la composición de la secreción de origen acinar."],"c":0,"e":"Las células ductales agregan bicarbonato y reabsorben cloruro."},{"q":"La ausencia del factor intrínseco","o":["Afecta la absorción del hierro.","Afecta la absorción de la vitamina B12","Afecta la absorción del calcio","No tiene consecuencias significativas para la salud"],"c":1,"e":"Sin factor intrínseco no se absorbe vitamina B12 en el íleon (anemia perniciosa)."},{"q":"Según Boltanski el concepto de cultura somática refiere:","o":["A las manifestaciones físicas del genotipo","A las regulaciones endocrinas del comportamiento individual","Al resultado de la interacción del genotipo de un individuo con el ambiente","A las normas que determinan las conductas físicas de los sujetos sociales"],"c":3,"e":"Boltanski: normas sociales, según la clase, que regulan el uso del cuerpo."},{"q":"Según Contreras Hernández y Arnaiz, en cuanto a las representaciones del cuerpo en las antiguas sociedades tribales:","o":["La delgadez se asociaba con el éxito, el poder y otros atributos altamente valorados","La gordura significaba seducción, atracción y prestigio","Prevalecía el ayuno en nombre de reivindicaciones sociales o políticas","Se promovía la moderación, la variedad y el equilibrio dietético"],"c":1,"e":"En sociedades de escasez la gordura significaba prestigio y atracción."},{"q":"Respecto a la adolescencia:","o"
